<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>SudokuForge · AI Solver</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-wrapper">
  <main class="container">
    <div class="brand">
      <h1>🤖 SudokuForge · AI Solver</h1>
      <p class="tagline">Backtracking solver — solves any valid puzzle</p>
    </div>

    <div class="page-tabs">
      <a href="index.html" class="tab">📌 Solve</a>
      <a href="solver.html" class="tab active">🤖 AI Solver</a>
    </div>

    <div class="action-group">
      <button id="solveAIBtn" class="btn-primary">🧠 Solve Puzzle</button>
      <button id="clearSolverBtn" class="btn-outline">🗑️ Clear Grid</button>
    </div>

    <div id="solverStatus" class="status-message">✨ Puzzle automatically loaded from Solve page (if any)</div>

    <div class="grid-container">
      <table id="solver-grid" class="sudoku-board"></table>
    </div>

    <div class="shortcuts-note">
      ⌨️ 1-9 · Delete · Arrow keys · S (solve) · C (clear)
    </div>
  </main>
</div>

<script src="js/common.js"></script>
<script src="js/solver.js"></script>
</body>
</html>
